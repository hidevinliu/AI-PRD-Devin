interface:
  display_name: "AI-PRD-Devin"
  short_description: "Write full product PRDs or concise module specifications with actionable behavior and acceptance."
  default_prompt: "Use $AI-PRD-Devin to specify this task in Chinese. Choose full PRD for a new product, substantial feature or explicit full-PRD request; use a short specification for a bounded module or 精简模式. Routine fixes need only a short plan unless I ask for a PRD. Follow my current whole-page UI reference and define observable acceptance without inheriting another project's constraints."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "generates structured PRDs from available product context"
    claude: "generates a full PRD or short specification according to task scope"
    generic: "uses the selected document depth and its matching quality checklist"
